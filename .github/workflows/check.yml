# Runs make check and make test. The main ruleset requires this job's check,
# reported as "check", so keep the job id and add no job name.

name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3.12: the Python in the ROCm immich-machine-learning image the script runs on.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install lint and test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check syntax and style
        run: make check
      - name: Test behavior
        run: make test
