# A minimal Immich stack that uses this repo the way the README says.
services:
  immich-machine-learning:
    image: &ml-image ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-rocm
    env_file: [ml.vars]
    networks: [immich-ml]
  immich-ml-warmup:
    extends:
      file: ../../compose.yaml
      service: immich-ml-warmup
    image: *ml-image
    user: "1000:1000"
    group_add: ["44", "991"]
    networks: [immich-ml]
    volumes:
      - ${MODEL_CACHE_LOCATION}:/cache
    env_file: [ml.vars]
networks:
  immich-ml:
